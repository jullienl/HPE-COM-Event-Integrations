[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "com-event-core"
version = "0.1.0"
description = "Shared COM event normaliser, de-duplication store, and target adapters for com-event-relay and com-event-bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lionel Jullien" }]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
"com-event-relay" = "https://github.com/jullienl/com-event-relay"
"com-event-bridge" = "https://github.com/jullienl/com-event-bridge"

[tool.setuptools.packages.find]
include = ["com_event_core*"]
