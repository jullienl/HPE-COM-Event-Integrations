name: Build and publish shim image

# Build the shim container and push it to GHCR. Same policy as the relay
# workflow: pushes on main + version tags, PRs build only.
#
# Monorepo: context is the repo ROOT so the build can include the shared
# com-event-core package. Rebuilds when the shim OR com-event-core changes.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "com-event-relay/shim/**"
      - "com-event-core/**"
      - ".github/workflows/build-shim.yml"
  pull_request:
    branches: [main]
    paths:
      - "com-event-relay/shim/**"
      - "com-event-core/**"
      - ".github/workflows/build-shim.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/com-event-shim

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./com-event-relay/shim/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
