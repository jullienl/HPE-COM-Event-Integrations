name: Build and publish relay image

# Build the relay container and push it to GitHub Container Registry (GHCR).
# Runs on pushes to main and on version tags (v1.2.3). Pull requests build only
# (no push) so forks/PRs can't publish images.
#
# Monorepo: the build context is the repo ROOT and the Dockerfile lives under
# com-event-relay/relay/. The relay does not depend on com-event-core.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "com-event-relay/relay/**"
      - ".github/workflows/build-relay.yml"
  pull_request:
    branches: [main]
    paths:
      - "com-event-relay/relay/**"
      - ".github/workflows/build-relay.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/com-event-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip login on pull_request (no push, and PRs from forks lack a token).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./com-event-relay/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
