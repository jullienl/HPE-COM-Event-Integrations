# TLS-terminating reverse proxy for com-event-bridge.
#
# The bridge is the public edge, so this proxy provides the CA-signed cert,
# request-size + rate limits, and forwards to the app on 127.0.0.1:8080.
# Pair with certbot (see docker-compose.yml / HARDENING.md) for auto-renewal.

# Rate limit: cap COM's (and any abuser's) request rate to the webhook.
limit_req_zone $binary_remote_addr zone=bridge:10m rate=20r/s;

server {
    listen 80;
    server_name com-bridge.example.com;

    # ACME HTTP-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else must use HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name com-bridge.example.com;

    # CA-signed certificate (certbot writes these paths).
    ssl_certificate     /etc/letsencrypt/live/com-bridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/com-bridge.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Hardening headers.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # COM only needs the webhook path; block everything else at the edge.
    location /com/webhook {
        limit_req zone=bridge burst=40 nodelay;
        client_max_body_size 256k;      # match MAX_BODY_BYTES

        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Optional: expose health to a monitoring subnet only (adjust allow/deny).
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
