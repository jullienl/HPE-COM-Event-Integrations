# Single-box on-prem stack: bridge + nginx (TLS) + certbot (auto-renew).
#
# This is the "all-in-one DMZ box" deployment. COM posts to nginx:443, which
# terminates TLS and proxies to the bridge on the internal network. certbot
# obtains + renews the certificate.
#
# First run (one-time cert issuance): see HARDENING.md for the certbot bootstrap
# command, then `docker compose up -d`.

services:
  bridge:
    build:
      # Context is the repo root (..) so the image can include the sibling
      # com-event-core package and is fully self-contained.
      context: ..
      dockerfile: com-event-bridge/bridge/Dockerfile
    image: com-event-bridge:local
    env_file: ./bridge/.env
    expose:
      - "8080"            # internal only; not published to the host
    volumes:
      - bridge-data:/data # persists spool.db + dedup.db across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - bridge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/com-event-bridge.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew twice daily; nginx picks up new certs on reload.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  bridge-data:
  certbot-etc:
  certbot-www:
